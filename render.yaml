services:
  # Web Service (Node.js + Express + Vite)
  - type: web
    name: lexai-cr
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexai-cr-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TILOPAY_API_KEY
        sync: false
      - key: TILOPAY_API_USER
        sync: false
      - key: TILOPAY_API_PASSWORD
        sync: false
      - key: DROPBOX_SIGN_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true

databases:
  # PostgreSQL Database with pgvector
  - name: lexai-cr-db
    databaseName: lexai_cr
    plan: free
    postgresMajorVersion: 16
